<text x="30" y="430" font-size="12" font-weight="normal" fill="#333" text-anchor="start">PK chave primária   ·   FK chave estrangeira   ·   1:N cada cliente possui várias transações   ·   1:1 cada cliente possui um rótulo</text>
<text x="30" y="456" font-size="12" font-weight="normal" fill="#333" text-anchor="start">Os rótulos ficam em arquivo separado e não entram na matriz de features: são usados apenas na avaliação dos modelos (Stage B).</text>
<text x="30" y="480" font-size="12" font-weight="normal" fill="#333" text-anchor="start">Variáveis latentes do gerador — perfil de consumo, cesta de categorias e ticket esperado — não são armazenadas; só seus efeitos aparecem nas transações.</text>
